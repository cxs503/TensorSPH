name: TensorSPH tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run unit and smoke tests
        run: python -m pytest -q
      - name: Run tiny end-to-end case
        run: |
          python examples/droplet_impact_2d/run.py --steps 3 --output artifacts/ci-droplet
          test -s artifacts/ci-droplet/diagnostics.csv
          test -s artifacts/ci-droplet/run_manifest.json
      - name: Upload smoke-run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tensorsph-smoke-python-${{ matrix.python-version }}
          path: artifacts/ci-droplet/
          if-no-files-found: warn
