[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorsph"
dynamic = ["version"]
description = "PyTorch-native SPH research solver for agent-driven scientific computing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["torch>=2.1"]

[project.urls]
Repository = "https://github.com/cxs503/TensorSPH"

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7.4", "matplotlib>=3.7", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "tensorsph.droplet_impact.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Correctness-only gate: pyflakes undefined names/unused imports, pycodestyle
# errors and warnings. Formatting is deliberately not enforced.
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# Report generators carry markdown table rows inside f-strings; wrapping them
# would corrupt the generated document.
"benchmarks/**/make_doc.py" = ["E501"]
