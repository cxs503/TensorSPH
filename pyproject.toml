[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorsph"
dynamic = ["version"]
description = "PyTorch-native SPH research solver for agent-driven scientific computing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["torch>=2.1"]

[project.urls]
Repository = "https://github.com/cxs503/TensorSPH"

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7.4", "matplotlib>=3.7", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "tensorsph.droplet_impact.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Agent scratch scripts live here; they are throw-away probes, not deliverables,
# and linting them turns unrelated PRs red (m3804: four PRs stuck on this).
exclude = [".scratch"]

[tool.ruff.lint]
# Correctness-only gate: pyflakes undefined names/unused imports, pycodestyle
# errors and warnings. Formatting is deliberately not enforced.
select = ["E", "F", "W"]

# Markdown/document builders hold whole CJK table rows and LaTeX lines inside
# string literals.  Recent ruff releases measure E501 in *display columns* (a CJK
# glyph counts two), so those templates are long by construction and cannot be
# wrapped without splitting the document text they emit.  E501 stays enforced in
# every other file (solver, tests, run.py drivers); this is the only exemption.
[tool.ruff.lint.per-file-ignores]
"benchmarks/*/make_doc.py" = ["E501"]
"benchmarks/*/publish_report.py" = ["E501"]
