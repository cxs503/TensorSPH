[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorsph"
dynamic = ["version"]
description = "PyTorch-native SPH research solver for agent-driven scientific computing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["torch>=2.1"]

[project.urls]
Repository = "https://github.com/cxs503/TensorSPH"

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7.4", "matplotlib>=3.7", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "tensorsph.droplet_impact.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Agent scratch scripts live here; they are throw-away probes, not deliverables,
# and linting them turns unrelated PRs red (m3804: four PRs stuck on this).
exclude = [".scratch"]

[tool.ruff.lint]
# Correctness-only gate: pyflakes undefined names/unused imports, pycodestyle
# errors and warnings. Formatting is deliberately not enforced.
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# Benchmark doc generators emit long Chinese markdown/LaTeX lines into docs/;
# a 100-column limit has no meaning for CJK text and these scripts are not
# runtime code.  Only E501 is waived -- pyflakes (F) and W stay enforced, so
# dead locals and unused imports in benchmark *runners* are still caught
# (that is exactly the F841 this change clears in run.py).
"benchmarks/**/make_doc.py" = ["E501"]
# Same reason for the report generators under docs/reports: they emit CJK
# markdown/LaTeX tables, and formatting is not what they are tested on.
"docs/reports/*_make_report.py" = ["E501"]
