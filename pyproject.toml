[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorsph"
dynamic = ["version"]
description = "PyTorch-native SPH research solver for agent-driven scientific computing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["torch>=2.1"]

[project.urls]
Repository = "https://github.com/cxs503/TensorSPH"

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=7.4", "matplotlib>=3.7", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "tensorsph.droplet_impact.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Agent scratch scripts live here; they are throw-away probes, not deliverables,
# and linting them turns unrelated PRs red (m3804: four PRs stuck on this).
exclude = [".scratch"]

[tool.ruff.lint]
# Correctness-only gate: pyflakes undefined names/unused imports, pycodestyle
# errors and warnings. Formatting is deliberately not enforced.
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# ``make_doc.py`` generators emit long-form Markdown verbatim: single table rows
# and prose paragraphs run to 600+ characters, and their output is byte-locked by
# the anti-drift tests (``tests/test_verification_ledger.py``) and the committed
# report files. Re-wrapping them would either change those documents or split a
# table row into invalid Markdown, so line length is not a meaningful gate here;
# every other rule still applies to these files.
"benchmarks/**/make_doc.py" = ["E501"]
