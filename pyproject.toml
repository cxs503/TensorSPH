[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorsph"
dynamic = ["version"]
description = "PyTorch-native SPH research solver for agent-driven scientific computing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "tensorsph.droplet_impact.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
